<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Interaktif</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background: linear-gradient(
                120deg,
                #111827,
                #312e81,
                #7c3aed,
                #0f766e,
                #111827
            );

            background-size: 400% 400%;
            animation: backgroundGerak 12s ease infinite;
        }

        /* ANIMASI BACKGROUND */
        @keyframes backgroundGerak {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* LINGKARAN BACKGROUND */
        .lingkaran {
            position: fixed;
            border-radius: 50%;
            filter: blur(5px);
            opacity: 0.35;
            animation: melayang 6s ease-in-out infinite;
        }

        .lingkaran.satu {
            width: 250px;
            height: 250px;
            background: #06b6d4;
            top: 5%;
            left: 8%;
        }

        .lingkaran.dua {
            width: 300px;
            height: 300px;
            background: #ec4899;
            right: 5%;
            bottom: 5%;
            animation-delay: 1s;
        }

        .lingkaran.tiga {
            width: 150px;
            height: 150px;
            background: #facc15;
            right: 30%;
            top: 10%;
            animation-delay: 2s;
        }

        @keyframes melayang {
            0%, 100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-30px) scale(1.15);
            }
        }

        /* KALKULATOR */
        .calculator {
            position: relative;
            z-index: 5;

            width: 370px;
            padding: 22px;

            border-radius: 30px;

            background: rgba(15, 23, 42, 0.88);

            border: 1px solid rgba(255,255,255,0.15);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.45),
                inset 0 1px 1px rgba(255,255,255,0.1);

            backdrop-filter: blur(20px);

            animation: muncul 0.8s ease;
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: scale(0.7) translateY(50px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .judul {
            color: white;
            text-align: center;
            margin-bottom: 15px;
        }

        .judul h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .judul p {
            color: #94a3b8;
            font-size: 12px;
        }

        /* LAYAR */
        .display {
            padding: 20px;
            margin-bottom: 18px;

            border-radius: 20px;

            background: rgba(2, 6, 23, 0.85);

            border: 1px solid rgba(255,255,255,0.08);

            text-align: right;

            box-shadow:
                inset 0 0 20px rgba(0,0,0,0.4);
        }

        .riwayat {
            height: 25px;
            color: #64748b;
            font-size: 14px;
            overflow: hidden;
        }

        .angka {
            color: white;
            font-size: 38px;
            font-weight: bold;
            min-height: 48px;

            word-break: break-all;

            transition: 0.2s;
        }

        .angka.berubah {
            animation: angkaPop 0.25s ease;
        }

        @keyframes angkaPop {
            0% {
                transform: scale(1);
                color: white;
            }

            50% {
                transform: scale(1.12);
                color: #22d3ee;
            }

            100% {
                transform: scale(1);
                color: white;
            }
        }

        /* PENJELASAN */
        .penjelasan {
            margin-top: 10px;
            padding: 10px;

            border-radius: 12px;

            color: #cbd5e1;
            background: rgba(255,255,255,0.05);

            font-size: 12px;
            text-align: center;

            min-height: 34px;

            transition: 0.3s;
        }

        /* TOMBOL */
        .tombol {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 65px;

            border: none;
            border-radius: 18px;

            color: white;
            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.08);

            box-shadow:
                0 6px 15px rgba(0,0,0,0.2);

            transition:
                transform 0.15s,
                background 0.3s,
                box-shadow 0.3s;
        }

        /* EFEK KETIKA DISENTUH */
        button:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-3px);
        }

        button:active,
        button.aktif {
            transform: scale(0.88);

            background: #22d3ee;

            box-shadow:
                0 0 25px #22d3ee;

            animation: tombolWarna 0.4s ease;
        }

        @keyframes tombolWarna {
            0% {
                background: #22d3ee;
            }

            50% {
                background: #a855f7;
            }

            100% {
                background: #22d3ee;
            }
        }

        /* OPERATOR */
        .operator {
            background: rgba(139, 92, 246, 0.35);
        }

        .operator:hover {
            background: rgba(168, 85, 247, 0.65);
        }

        /* AC */
        .hapus {
            background: rgba(239, 68, 68, 0.35);
        }

        /* SAMA DENGAN */
        .hasil {
            background: linear-gradient(
                135deg,
                #06b6d4,
                #8b5cf6,
                #ec4899
            );

            background-size: 200% 200%;

            animation: warnaHasil 4s ease infinite;
        }

        @keyframes warnaHasil {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* FOOTER */
        .footer {
            text-align: center;
            color: #64748b;
            font-size: 11px;
            margin-top: 15px;
        }

        /* RESPONSIVE */
        @media (max-width: 450px) {
            .calculator {
                width: 92%;
                padding: 18px;
            }

            button {
                height: 58px;
            }

            .angka {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <!-- BACKGROUND ANIMASI -->
    <div class="lingkaran satu"></div>
    <div class="lingkaran dua"></div>
    <div class="lingkaran tiga"></div>

    <!-- KALKULATOR -->
    <div class="calculator">

        <div class="judul">
            <h1>🧮 Kalkulator Interaktif</h1>
            <p>Klik angka dan lihat efeknya</p>
        </div>

        <!-- DISPLAY -->
        <div class="display">

            <div id="riwayat" class="riwayat">
                Siap menghitung...
            </div>

            <div id="angka" class="angka">
                0
            </div>

            <div id="penjelasan" class="penjelasan">
                Masukkan angka untuk memulai
            </div>

        </div>

        <!-- TOMBOL -->
        <div class="tombol">

            <button class="hapus" data-value="C">C</button>
            <button class="operator" data-value="⌫">⌫</button>
            <button class="operator" data-value="%">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="hasil" data-value="=">=</button>
        </div>

        <div class="footer">
            Pustaka Coding • Kalkulator JavaScript
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
